services:
  - type: web
    name: dnagasumukh-portfolio
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: ""
    staticPublishPath: "./"
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
